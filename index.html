<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ahmed — UE5/C++ Game Developer & CS/AIML student at Mumbai University. Building gameplay AI, physics systems, and interactive web experiences." />
  <meta name="keywords" content="game developer, unreal engine 5, C++, portfolio, AI, Mumbai University, IEEE" />
  <meta property="og:title" content="Ahmed — Game Developer & Engineer" />
  <meta property="og:description" content="UE5/C++ Game Developer, CS/AIML student. Enemy AI, Chaos Physics, and more." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#2F86B3" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" />

  <!-- Anti-flash theme: must run before React to prevent FOUC -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        // Default is light — do NOT follow prefers-color-scheme
      } catch(e) {}
    })();
  </script>

  <!-- Critical inline CSS: prevents flash of unstyled content -->
  <style>
    html { background: #EEF8FD; }
    html.dark { background: #132737; }
    body { margin: 0; }
  </style>

  <title>Ahmed — Game Developer & Engineer</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
