<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed's F1 Circuit Motion Path Test — Anime.js v4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080B11;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', monospace, system-ui, sans-serif;
      padding: 24px;
      color: #F0F6FC;
    }
    .track-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      background: rgba(13, 17, 26, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(12px);
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .track-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00F0FF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 10px #00F0FF;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
    .track-telemetry {
      font-size: 12px;
      color: #9D5BFF;
      letter-spacing: 1.5px;
    }
    svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.25));
    }
    .car {
      will-change: transform;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "animejs": "./web/motion_track/anime.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div class="track-wrapper">
    <div class="track-header">
      <div class="track-title">
        <span class="pulse-dot"></span>
        <span>GLACIER GRAND PRIX // ANIME.JS V4 MOTION PATH</span>
      </div>
      <div class="track-telemetry">LIVE TELEMETRY • ACTIVE LAP</div>
    </div>
    <div class="svg-container">
      <svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F0FF" />
            <stop offset="50%" stop-color="#7B61FF" />
            <stop offset="100%" stop-color="#B55BFF" />
          </linearGradient>

          <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.5" result="blur1" />
            <feGaussianBlur stdDeviation="7" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <radialGradient id="trailGlow" cx="70%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95" />
            <stop offset="50%" stop-color="#9D5BFF" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#9D5BFF" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Main Animated Glowing Track Line -->
        <path
          id="circuit-path"
          d="M 120,130 C 200,130 320,70 440,70 C 520,70 600,50 680,80 C 740,100 760,155 820,165 C 880,175 920,105 970,90 C 1030,75 1090,95 1120,130 C 1145,160 1115,205 1060,215 C 1010,225 950,200 900,185 C 830,165 750,175 680,200 C 610,225 550,220 490,185 C 420,150 350,165 280,195 C 200,225 120,215 80,180 C 50,150 65,130 120,130 Z"
          fill="none"
          stroke="url(#trackGrad)"
          stroke-width="2.8"
          stroke-linecap="round"
          filter="url(#neonGlow)"
        />

        <!-- Start/Finish Gate Marker -->
        <g transform="translate(120, 130)">
          <line x1="0" y1="-14" x2="0" y2="14" stroke="#00F0FF" stroke-width="2.5" opacity="0.85" />
          <line x1="3" y1="-10" x2="3" y2="10" stroke="#9D5BFF" stroke-width="1.5" opacity="0.75" stroke-dasharray="2 3" />
        </g>

        <!-- Moving vehicle element (.car) -->
        <g class="car" id="race-car">
          <!-- Jet / energy trail behind car -->
          <ellipse cx="-16" cy="0" rx="16" ry="6" fill="url(#trailGlow)" />
          
          <!-- Outer neon glow -->
          <circle cx="0" cy="0" r="14" fill="#00F0FF" opacity="0.3" filter="url(#neonGlow)" />

          <!-- Rear wing -->
          <rect x="-14" y="-8" width="3.2" height="16" rx="1.5" fill="#9D5BFF" stroke="#00F0FF" stroke-width="0.8" />
          
          <!-- Main fuselage -->
          <polygon points="-13,-4 -8,-6 6,-4 14,-1.5 18,0 14,1.5 6,4 -8,6 -13,4" fill="#090D16" stroke="#00F0FF" stroke-width="1.4" />
          
          <!-- Side pods -->
          <rect x="-4" y="-7.2" width="8" height="2.2" rx="1" fill="#151C2C" stroke="#00F0FF" stroke-width="0.6" />
          <rect x="-4" y="5" width="8" height="2.2" rx="1" fill="#151C2C" stroke="#00F0FF" stroke-width="0.6" />
          
          <!-- Driver cockpit -->
          <ellipse cx="0" cy="0" rx="4" ry="2" fill="#B55BFF" stroke="#FFFFFF" stroke-width="0.6" />
          
          <!-- Front wing -->
          <rect x="13" y="-6.5" width="2.5" height="13" rx="1" fill="#00F0FF" />
          
          <!-- Headlight flare -->
          <circle cx="17" cy="0" r="5" fill="url(#headlightGlow)" />
          <circle cx="17" cy="0" r="1.8" fill="#FFFFFF" />
        </g>
      </svg>
    </div>
  </div>

  <script type="module">
    import { animate, svg } from 'animejs';

    // Animate a shape/icon along the path
    const carAnimation = animate('.car', {
      ease: 'linear',
      duration: 5000,
      loop: true,
      ...svg.createMotionPath('path')
    });

    // Optional: make the line draw itself in sync, for a nicer visual effect
    animate(svg.createDrawable('path'), {
      draw: '0 1',
      ease: 'linear',
      duration: 5000,
      loop: true,
    });
  </script>
</body>
</html>
