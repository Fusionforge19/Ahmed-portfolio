<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Circuit Motion Path — Anime.js v4</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .track-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 240px;
      overflow: visible;
      filter: drop-shadow(0 4px 12px rgba(28, 58, 94, 0.12));
    }

    /* Style the car marker */
    .car {
      will-change: transform;
      pointer-events: none;
    }

    /* Sector indicator badges */
    .sector-badge {
      font-family: 'Segoe UI', monospace, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #1C3A5E;
      text-anchor: middle;
      opacity: 0.75;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "animejs": "./anime.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div class="track-container">
    <svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Calm Blue Track Gradient -->
        <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1C3A5E" />
          <stop offset="50%" stop-color="#5A87AC" />
          <stop offset="100%" stop-color="#AED4E8" />
        </linearGradient>

        <!-- Subtle track shadow -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Exhaust Jet Trail Gradient -->
        <radialGradient id="trailGlow" cx="70%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#5A87AC" stop-opacity="0.8" />
          <stop offset="60%" stop-color="#AED4E8" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#AED4E8" stop-opacity="0" />
        </radialGradient>

        <!-- Headlight laser flare -->
        <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="50%" stop-color="#AED4E8" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#AED4E8" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Main Animated Track Line -->
      <path
        id="circuit-track"
        d="M 120,130 C 200,130 320,70 440,70 C 520,70 600,50 680,80 C 740,100 760,155 820,165 C 880,175 920,105 970,90 C 1030,75 1090,95 1120,130 C 1145,160 1115,205 1060,215 C 1010,225 950,200 900,185 C 830,165 750,175 680,200 C 610,225 550,220 490,185 C 420,150 350,165 280,195 C 200,225 120,215 80,180 C 50,150 65,130 120,130 Z"
        fill="none"
        stroke="url(#trackGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
      />

      <!-- Start/Finish Gate Marker -->
      <g transform="translate(120, 130)">
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#1C3A5E" stroke-width="2.5" opacity="0.85" />
        <line x1="3" y1="-10" x2="3" y2="10" stroke="#5A87AC" stroke-width="1.5" opacity="0.75" stroke-dasharray="2 3" />
        <text x="0" y="-18" class="sector-badge">START / FINISH</text>
      </g>

      <!-- Sector Badges -->
      <text x="680" y="65" class="sector-badge">SECTOR 1 • SPEEDWAY</text>
      <text x="1100" y="235" class="sector-badge">SECTOR 2 • HAIRPIN</text>
      <text x="490" y="235" class="sector-badge">SECTOR 3 • CHICANE</text>

      <!-- Moving F1 Car / Vehicle Marker -->
      <g class="car" id="race-car">
        <!-- Trail behind car -->
        <ellipse cx="-16" cy="0" rx="16" ry="6" fill="url(#trailGlow)" />

        <!-- Halo glow around car -->
        <circle cx="0" cy="0" r="14" fill="#5A87AC" opacity="0.15" />

        <!-- Rear wing -->
        <rect x="-14" y="-8" width="3.2" height="16" rx="1.5" fill="#1C3A5E" stroke="#5A87AC" stroke-width="0.8" />

        <!-- Aerodynamic F1 chassis polygon -->
        <polygon points="-13,-4 -8,-6 6,-4 14,-1.5 18,0 14,1.5 6,4 -8,6 -13,4" fill="#1C3A5E" stroke="#5A87AC" stroke-width="1.4" />

        <!-- Side pods -->
        <rect x="-4" y="-7.2" width="8" height="2.2" rx="1" fill="#2D4D73" stroke="#5A87AC" stroke-width="0.6" />
        <rect x="-4" y="5" width="8" height="2.2" rx="1" fill="#2D4D73" stroke="#5A87AC" stroke-width="0.6" />

        <!-- Driver cockpit -->
        <ellipse cx="0" cy="0" rx="4" ry="2" fill="#AED4E8" stroke="#FFFFFF" stroke-width="0.6" />

        <!-- Front aerodynamic wing -->
        <rect x="13" y="-6.5" width="2.5" height="13" rx="1" fill="#5A87AC" />

        <!-- Headlight laser flare -->
        <circle cx="17" cy="0" r="5" fill="url(#headlightGlow)" />
        <circle cx="17" cy="0" r="1.8" fill="#FFFFFF" />
      </g>
    </svg>
  </div>

  <script type="module">
    import { animate, svg } from 'animejs';

    function startAnimation() {
      // Animate a shape/icon along the path
      const carAnimation = animate('.car', {
        ease: 'linear',
        duration: 5000,
        loop: true,
        ...svg.createMotionPath('path')
      });

      // Optional: make the line draw itself in sync, for a nicer visual effect
      animate(svg.createDrawable('path'), {
        draw: '0 1',
        ease: 'linear',
        duration: 5000,
        loop: true,
      });

      console.log('Anime.js v4 motion path & drawable animation successfully initialized.');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(startAnimation));
    } else {
      requestAnimationFrame(startAnimation);
    }
  </script>
</body>
</html>
